ox\">\n                    <p>τ = κθ</p>\n                    <p>T = 2π√(I/κ)</p>\n                </div>\n                <div class=\"description\">\n                    扭擺系統在小角度下符合<span class=\"highlight\">簡諧運動 (SHM)</span> 特性。透過測量週期 T 與已知轉動慣量 I，可精確反推系統的宏觀扭力係數 κ。\n                </div>\n            </div>\n            <div class=\"theory-card\">\n                <div class=\"card-title\">02_材料彈性模量</div>\n                <div class=\"formula-box\">\n                    <p>κ = G · (J/L)</p>\n                    <p>J = πr⁴ / 2</p>\n                </div>\n                <div class=\"description\">\n                    <span class=\"highlight\">剪切模數 G</span> 代表材料微觀剛性。極慣性矩 J 代表截面形狀貢獻。扭力係數與線長 L 成反比，與半徑 r 的四次方成正比。\n                </div>\n            </div>\n            <div class=\"theory-card\">\n                <div class=\"card-title\">03_聖維南修正理論</div>\n                <div class=\"formula-box\">\n                    <p>J_eff ≈ ⅓wt³(1-0.63t/w)</p>\n                </div>\n                <div class=\"description\">\n                    非圓形截面受扭時會發生<span class=\"highlight\">截面翹曲 (Warping)</span>。對於絲帶狀截面，其抗扭能力主要受厚度 t 的三次方與寬度 w 的一次方影響。\n                </div>\n            </div>\n        </div>\n    </div>\n</body>\n</html>\n"}, {"title": "實驗設備與裝置結構示意圖表說明內容表單", "srcdoc": "<!DOCTYPE html>\n<html lang=\"zh-TW\">\n<head>\n    <link href=\"https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap\" rel=\"stylesheet\">\n    <link href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css\" rel=\"stylesheet\">\n    <style>\n        body { margin: 0; background: #F9F7F2; }\n        .slide-container {\n            width: 1280px;\n            min-height: 720px;\n            background: #F9F7F2;\n            color: #4A4A4A;\n            font-family: 'Lato', sans-serif;\n            display: flex;\n            flex-direction: column;\n            padding-top: 60px;\n            padding-left: 80px;\n      <div class=\"mt-6 flex justify-center gap-8 text-xs font-sans\">\n                <div class=\"flex items-center gap-2\">\n                    <div class=\"w-3 h-3 bg-[#2d5a27]\"></div>\n                    <span>測量扭力係數 κ</span>\n                </div>\n                <div class=\"flex items-center gap-2\">\n                    <div class=\"w-3 h-3 bg-[#d1d1d1]\"></div>\n                    <span>理論預測值 κ</span>\n                </div>\n            </div>\n        </div>\n    </div>\n\n    <div class=\"mt-auto pt-8 border-t border-[#e0e0e0] flex justify-between text-[10px] text-[#8c8c8c] uppercase tracking-widest\">\n        <span>Torsion Study Project</span>\n        <span>Page 08 / 11</span>\n    </div>\n\n    <script src=\"https://cdn.jsdelivr.net/npm/chart.js\"><\/script>\n    <script>\n        const ctx = document.getElementById('organicExp2ChartFinal').getContext('2d');\n        new Chart(ctx, {\n            type: 'line',\n            data: {\n                labels: ['0.6cm', '0.9cm', '2.0cm', '3.7cm', '5.0cm'],\n                datasets: [{\n                    label: '測量 κ',\n                    data: [7.16e-7, 2.87e-6, 1.05e-5, 3.56e-5, 1.29e-4],\n                    borderColor: '#2d5a27',\n                    backgroundColor: 'rgba(45, 90, 39, 0.05)',\n                    borderWidth: 3,\n                    pointRadius: 5,\n                    pointBackgroundColor: '#2d5a27',\n                    tension: 0.3,\n                    fill: true\n                }, {\n                    label: '理論 κ',\n                    data: [1.88e-6, 2.87e-6, 6.50e-6, 1.21e-5, 1.64e-5],\n                    borderColor: '#d1d1d1',\n                    borderDash: [5, 5],\n                    borderWidth: 2,\n                    pointRadius: 4,\n                    pointBackgroundColor: '#fff',\n                    tension: 0\n                }]\n            },\n            options: {\n                responsive: true,\n                maintainAspectRatio: false,\n tween;\n            gap: 40px;\n            flex: 1;\n        }\n        .column {\n            flex: 1;\n            display: flex;\n            flex-direction: column;\n        }\n        .section-title {\n            font-family: 'Playfair Display', serif;\n            font-size: 24px;\n            font-weight: 700;\n            color: #C1663E;\n            margin-bottom: 25px;\n            display: flex;\n            align-items: center;\n        }\n        .section-title i {\n            margin-right: 15px;\n            font-size: 20px;\n        }\n        .info-block {\n            background: rgba(45, 90, 39, 0.03);\n            border-top: 2px solid #2D5A27;\n            padding-top: 20px;\n            padding-left: 20px;\n            padding-right: 20px;\n            margin-bottom: 30px;\n        }\n        .block-label {\n            font-family: 'Playfair Display', serif;\n            font-weight: 700;\n            color: #2D5A27;\n            margin-bottom: 15px;\n            display: block;\n            font-size: 20px;\n        }\n        .block-text {\n            font-size: 17px;\n            line-height: 1.7;\n            color: #4A4A4A;\n            text-align: justify;\n            margin-bottom: 20px;\n        }\n        .highlight {\n            color: #C1663E;\n            font-weight: 700;\n        }\n        .discussion-card {\n            background: rgba(193, 102, 62, 0.03);\n            border-top: 2px solid #C1663E;\n            padding-top: 25px;\n            padding-left: 25px;\n            padding-right: 25px;\n            flex: 1;\n            margin-bottom: 40px;\n        }\n        .card-item {\n            margin-bottom: 25px;\n        }\n        .card-item-title {\n            color: #C1663E;\n            font-weight: 700;\n            margin-bottom: 10px;\n            display: block;\n            font-family: 'Playfair Display', serif;\n            font-size: 18px;\n        }\n        .conclusion-text {\n            border-top: 1px solid rgba(193, 102, 62, 0.3);\n            padding-top: 15px;\n            font-style: italic;\n            color: #2D5A27;\n            font-weight: 700;\n            text-align: center;\n            font-size: 18px;\n        }\n    </style>\n</head>\n<body>\n    <div class=\"slide-container\">\n        <div class=\"header\">\n            <h2 class=\"title\">誤差分析與力學特性深入討論 // ANALYSIS</h2>\n            <div style=\"font-size: 14px; color: #C1663E; font-style: italic;\">Critical Evaluation</div>\n        </div>\n        <div class=\"content-grid\">\n            <div class=\"column\">\n                <div class=\"section-title\"><i class=\"fas fa-exclamation-triangle\"></i> 實驗誤差來源分析</div>\n                <div class=\"info-block\">\n                    <span class=\"block-label\">01. 線材直徑測量偏差</span>\n                    <div class=\"block-text\">\n                        剪切模數 $G$ 與半徑四次方成反比。微小的直徑測量誤差（如 5%）會被幾何級數放大至約 <span class=\"highlight\">20% 的 $G$ 值偏差</span>，這是本實驗最大的潛在誤差源。\n                    </div>\n                </div>\n                <div class=\"info-block\">\n                    <span class=\"block-label\">02. 環境阻力與摩擦損耗</span>\n                    <div class=\"block-text\">\n                        雖然採用密封裝置，但內部殘餘空氣阻力與懸掛固定端的微小摩擦仍會導致週期 <span class=\"highlight\">非理想化增加</span>，使計算出的扭力係數略低於真實值。\n                    </div>\n                </div>\n            </div>\n            <div class=\"column\">\n                <div class=\"section-title\"><i class=\"fas fa-balance-scale\"></i> 力學特性綜合探討</div>\n                <div class=\"discussion-card\">\n                    <div class=\"card-item\">\n                        <span class=\"card-item-title\">材質剛性 (G) 的決定性</span>\n                        <div class=\"block-text\">\n                            金屬線材展現出極高的剪切模數，其抗扭剛性遠超非金屬材質，是決定系統扭力行為的<span class=\"highlight\">核心本質因素</span>。\n                        </div>\n                    </div>\n                    <div class=\"card-item\">\n                        <span class=\"card-item-title\">幾何因子 (J) 的補償效應</span>\n                        <div class=\"block-text\">\n                            對於絲帶等非圓形截面，透過增加寬度（提升極慣性矩 $J$ 值），仍能顯著增強整體的扭力係數 $\\kappa$，展現了幾何形狀對力學表現的強大塑造力。\n                        </div>\n                    </div>\n                    <div class=\"conclusion-text\">\n                        結論：系統扭力表現是材料本質與幾何特徵兩者權重疊加的物理結果。\n                    </div>\n                </div>\n            </div>\n        </div>\n    </div>\n</body>\n</html>\n"}, {"title": "核心發現：雙線擺效應與重力介入機制分析說明內容表單", "srcdoc": "<!DOCTYPE html>\n<html lang=\"zh-TW\">\n<head>\n    <link href=\"https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap\" rel=\"stylesheet\">\n    <link href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css\" rel=\"stylesheet\">\n    <style>\n        body { margin: 0; background: #F9F7F2; }\n        .slide-container {\n            width: 1280px;\n            min-height: 720px;\n            background: #F9F7F2;\n            color: #4A4A4A;\n            font-family: 'Lato', sans-serif;\n            display: flex;\n            flex-direction: column;\n            padding-top: 60px;\n            padding-left: 80px;\n            padding-right: 80px;\n            box-sizing: border-box;\n            overflow: hidden;\n        }\n        .header {\n            margin-bottom: 40px;\n            border-bottom: 1px solid #2D5A27;\n            padding-bottom: 15px;\n        }\n        .title {\n            font-family: 'Playfair Display', serif;\n            font-size: 36px;\n            font-weight: 700;\n            color: #2D5A27;\n            margin: 0;\n        }\n        .main-content {\n            display: flex;\n            justify-content: space-between;\n            gap: 40px;\n            flex: 1;\n        }\n        .column {\n            flex: 1;\n            display: flex;\n            flex-direction: column;\n        }\n        .sec v class=\"header\">\n            <h1 class=\"title\">核心發現：雙線擺效應與重力介入 // CORE_DISCOVERY</h1>\n        </div>\n        <div class=\"main-content\">\n            <div class=\"column\">\n                <h2 class=\"section-title\">現象分析：升抬與螺旋路徑</h2>\n                <div class=\"concept-card\">\n                    <i class=\"fas fa-project-diagram\"></i>\n                    <div class=\"concept-text\">\n                        絲帶具有極大的寬高比。在大角度扭轉時，邊緣纖維被迫走<span class=\"highlight\">螺旋路徑</span>，導致線材有效長度縮短，進而微幅上拉底部的金屬棒。\n                    </div>\n                    <div class=\"concept-text\" style=\"margin-top: 25px;\">\n                        此物理行為在性質上等同於兩條獨立的懸吊線，即所謂的<span class=\"highlight\">「雙線擺（盪鞦韆）」</span>結構。\n                    </div>\n                </div>\n            </div>\n            <div class=\"column\">\n                <h2 class=\"section-title\">力學機制：重力回復力矩</h2>\n                <div class=\"concept-card\" style=\"background: rgba(193, 102, 62, 0.02); border-color: rgba(193, 102, 62, 0.1);\">\n                    <i class=\"fas fa-balance-scale-right\"></i>\n                    <div class=\"concept-text\">\n                        由於升抬現象，懸掛物的<span class=\"highlight\">「重力」</span>會介入並產生額外的回復力矩。這導致整體的抗扭能力隨寬度急遽上升，而非線性增長。\n                    </div>\n                    <div class=\"conclusion-banner\">\n                        <div class=\"conclusion-title\">核心結論 // CONCLUSION</div>\n                        <div class=\"conclusion-text\">\n                            傳統純剪切理論失效，必須納入<span class=\"highlight\" style=\"color: #F9F7F2;\">重力張力效應</span>。\n                        </div>\n                    </div>\n                </div>\n            </div>\n        </div>\n    </div>\n</body>\n</html>\n"}, {"title": "研究結論與未來展望總結頁面說明內容表單", "srcdoc": "<!DOCTYPE html>\n<html lang=\"zh-TW\">\n<head>\n    <link href=\"https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap\" rel=\"stylesheet\">\n    <link href=\"htt >\n                </div>\n            </div>\n            <div class=\"column\" style=\"background: rgba(193, 102, 62, 0.02); border-top-color: #C1663E;\">\n                <div class=\"section-title\"><i class=\"fas fa-rocket\"></i> 未來展望</div>\n                <div class=\"conclusion-item\">\n                    <i class=\"fas fa-pencil-ruler\" style=\"color: #C1663E;\"></i>\n                    <div><span class=\"highlight\">03. 模型修正：</span> 針對平行並列多股線材建立更精確的力學修正模型，探討並列間距對扭力耦合的影響。</div>\n                </div>\n                <div class=\"conclusion-item\">\n                    <i class=\"fas fa-microchip\" style=\"color: #C1663E;\"></i>\n                    <div><span class=\"highlight\">04. AI 協作：</span> 本研究展示了 AI 在實驗設計與數據處理中的輔助潛力，為科學探究提供新路徑。</div>\n                </div>\n                <div class=\"footer-organic\">\n                    <div class=\"organic-info\">Status: Research Completed // Archive 2026</div>\n                    <div class=\"thanks-text\">THANK YOU</div>\n                </div>\n            </div>\n        </div>\n    </div>\n</body>\n</html>\n"}];let n=0;const deck=document.getElementById('deck'),counter=document.getElementById('counter');function fitFrame(f){const root=f.contentDocument&&f.contentDocument.querySelector('.slide-container');if(!root)return;const scale=Math.min(1,f.clientWidth/1280);root.style.transformOrigin='top left';root.style.transform='scale('+scale+')';root.style.width='1280px';root.style.height='720px';root.style.minHeight='0';const doc=f.contentDocument;doc.documentElement.style.overflow='hidden';doc.body.style.width='1280px';doc.body.style.height='720px';doc.body.style.overflow='hidden'}slides.forEach((s,i)=>{const el=document.createElement('section');el.className='slide'+(i===0?' active':'');const f=document.createElement('iframe');f.title=s.title;f.srcdoc=s.srcdoc;f.addEventListener('load',()=>{fitFrame(f);requestAnimationFrame(()=>fitFrame(f))});el.append(f);deck.append(el)});function show(i){n=(i+slides.length)%slides.length;document.querySelectorAll('.slide').forEach((e,j)=>e.classList.toggle('active',j===n));const active=document.querySelectorAll('.slide')[n];if(active)fitFrame(active.querySelector('iframe'));counter.textContent=(n+1)+' / '+slides.length+'　'+slides[n].title}document.getElementById('prev').onclick=()=>show(n-1);document.getElementById('next').onclick=()=>show(n+1);addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(n-1);if(e.key==='ArrowRight')show(n+1)});addEventListener('resize',()=>document.querySelectorAll('.slide iframe').forEach(f=>fitFrame(f)));show(0)</script></body></html>
