<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>專案網站</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<!--
  通用專案網站引擎（site-templates）
  這個檔案不用改：網站名稱、分頁、儲存庫都在 data/site.json 設定，內容都在 data/、items/、notes/。
-->
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #5d6677; --line: #e3e6ec;
    --accent: #0f9d8f; --done: #1f9d55; --blocked: #c2410c; --todo: #6b7280; --doing: #2563eb;
    --code: #f0f2f5; --on-badge: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11151c; --card: #19202a; --text: #e6e9ef; --muted: #9aa3b2; --line: #2a3340;
      --accent: #2dd4bf; --done: #4ade80; --blocked: #fb923c; --todo: #9ca3af; --doing: #60a5fa;
      --code: #222b37; --on-badge: #11151c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11151c; --card: #19202a; --text: #e6e9ef; --muted: #9aa3b2; --line: #2a3340;
    --accent: #2dd4bf; --done: #4ade80; --blocked: #fb923c; --todo: #9ca3af; --doing: #60a5fa;
    --code: #222b37; --on-badge: #11151c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; line-height: 1.6; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { margin: 0 0 4px; font-size: 28px; }
  header p { margin: 0; color: var(--muted); }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; font-size: 13px; color: var(--muted); }
  nav { display: flex; gap: 4px; margin: 28px 0 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  nav button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
               padding: 8px 14px; font: inherit; cursor: pointer; white-space: nowrap; }
  nav button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  section[hidden] { display: none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
  .goal { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: start; }
  .goal h3 { margin: 0; font-size: 16px; }
  .goal p { grid-column: 2; margin: 0; color: var(--muted); font-size: 14px; }
  .badge { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 2px 8px; color: var(--on-badge); white-space: nowrap; background: var(--todo); }
  .badge.done { background: var(--done); } .badge.blocked { background: var(--blocked); }
  .badge.todo, .badge.planning { background: var(--todo); }
  .badge.doing, .badge.registered, .badge.ongoing { background: var(--doing); }
  h2 { font-size: 18px; margin: 24px 0 10px; }
  h2 small { font-weight: 400; }
  ol.next { margin: 0; padding-left: 20px; }
  .ver { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .ver strong { font-size: 16px; }
  .ver .v { font-family: ui-monospace, Consolas, monospace; color: var(--accent); font-weight: 700; }
  .ver small, .muted { color: var(--muted); }
  .muted { font-size: 14px; }
  .card ul { margin: 8px 0 0; padding-left: 20px; }
  .row-line { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .row-line:last-child { border-bottom: 0; }
  .row-line code { color: var(--accent); }
  .row-line time { color: var(--muted); white-space: nowrap; }
  .file { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; align-items: baseline; }
  .file:last-child { border-bottom: 0; }
  .file a { overflow-wrap: anywhere; }
  .file .size { text-align: right; white-space: nowrap; }
  .list a { display: block; padding: 8px 0; color: var(--text); text-decoration: none; border-bottom: 1px solid var(--line); }
  .list a:hover { color: var(--accent); }
  .list small { color: var(--muted); margin-left: 8px; }
  article { overflow-wrap: anywhere; }
  article img, article video { max-width: 100%; height: auto; border-radius: 8px; }
  article table { border-collapse: collapse; width: 100%; font-size: 14px; display: block; overflow-x: auto; }
  article th, article td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  article code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  article pre { background: var(--code); padding: 12px; border-radius: 8px; overflow-x: auto; }
  article pre code { background: none; padding: 0; }
  a { color: var(--accent); }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar p { margin: 0; }
  .btn { background: var(--accent); color: var(--on-badge); border: 0; border-radius: 8px; padding: 8px 16px; font: inherit; cursor: pointer; }
  .btn.ghost { background: none; color: var(--text); border: 1px solid var(--line); }
  form h3 { margin: 0 0 4px; }
  form label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); margin-top: 10px; }
  form input, form select, form textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 16px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; }
  .item { cursor: pointer; display: block; color: inherit; text-decoration: none; }
  .item:hover { border-color: var(--accent); }
  .item h3 { margin: 6px 0 2px; font-size: 17px; }
  .item .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
  .item p { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
  dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 12px 0; font-size: 14px; }
  dl.facts dt { color: var(--muted); } dl.facts dd { margin: 0; }
  .search { position: relative; margin-top: 20px; }
  .search input { width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 40px 10px 14px; }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .search kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
  #search-results { margin-top: 8px; }
  .hit { display: block; padding: 10px 0; border-bottom: 1px solid var(--line); color: var(--text); text-decoration: none; }
  .hit:last-child { border-bottom: 0; }
  .hit:hover strong { color: var(--accent); }
  .hit .where { font-size: 12px; color: var(--muted); margin-right: 8px; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
  .hit p { margin: 4px 0 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  mark { background: color-mix(in srgb, var(--accent) 30%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
  .flash { outline: 2px solid var(--accent); outline-offset: 2px; transition: outline-color 1.5s; }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
  @media (max-width: 560px) { .row-line { grid-template-columns: 1fr; gap: 2px; } .file { grid-template-columns: 1fr auto; } .file .size { grid-column: 2; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="site-title">載入中…</h1>
    <p id="site-subtitle"></p>
    <div class="meta" id="meta"></div>
    <div class="search" role="search">
      <input type="search" id="search-box" placeholder="搜尋全站：目標、活動、版本、筆記內文、檔案…" aria-label="搜尋全站" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <div class="card" id="search-results" hidden></div>
  </header>

  <nav role="tablist" id="tabs"></nav>

  <section id="status" hidden></section>
  <section id="modules" hidden></section>
  <section id="items" hidden>
    <div class="toolbar">
      <p class="muted" id="items-hint"></p>
      <button type="button" class="btn" id="add-item-btn">＋ 新增</button>
    </div>
    <form class="card" id="item-form" hidden>
      <h3 id="item-form-title">新增</h3>
      <p class="muted">填好後按「送到 GitHub」，會開啟 GitHub 新增檔案頁面（內容已填好），用專案帳號登入後按 <b>Commit changes</b> 就完成。約 1 分鐘後這裡就看得到。</p>
      <div class="grid">
        <label>名稱 *<input name="title" required></label>
        <label>日期 *<input name="date" type="date" required></label>
        <label>狀態<select name="status" id="item-status"></select></label>
        <label>結果 / 成績<input name="result"></label>
      </div>
      <label>其他資訊（一行一個：欄位 | 內容）<textarea name="facts" rows="3" placeholder="主辦單位 | ○○○&#10;地點 | ○○○"></textarea></label>
      <label>一句話摘要<input name="summary"></label>
      <label>詳細說明（可用 Markdown）<textarea name="description" rows="5"></textarea></label>
      <label>相關連結（一行一個：標題 | 網址）<textarea name="links" rows="3" placeholder="簡章 | https://..."></textarea></label>
      <div class="actions">
        <button type="submit" class="btn">送到 GitHub</button>
        <button type="button" class="btn ghost" id="copy-item-btn">複製 JSON</button>
        <button type="button" class="btn ghost" id="cancel-item-btn">取消</button>
        <span class="muted" id="item-form-msg"></span>
      </div>
    </form>
    <div id="item-list"></div>
    <article class="card" id="item-detail" hidden></article>
  </section>
  <section id="versions" hidden></section>
  <section id="notes" hidden>
    <div class="card list" id="notes-list"></div>
    <article class="card" id="note" hidden></article>
  </section>
  <section id="files" hidden>
    <p class="muted">🔒 原始檔放在私人儲存庫，需要用專案帳號登入 GitHub 才能開啟與下載。</p>
    <div id="file-groups"></div>
  </section>
  <section id="commits" hidden>
    <p class="muted">每一次修改網站都會留下一筆紀錄（來自 GitHub）。</p>
    <div class="card" id="commit-list">載入中…</div>
  </section>

  <footer id="footer"></footer>
</div>

<script>
// ---------- 共用 ----------
const TAB_LABELS = { status: '目前進度', modules: '開發進度', items: '活動', versions: '版本紀錄', notes: '筆記', files: '原始檔', commits: '更新紀錄' };
const GOAL_STATUS = { done: '完成', doing: '進行中', blocked: '卡住', todo: '待辦' };
let site = {};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// GitHub Pages 的 CDN 會快取最多 10 分鐘；加上唯一參數讓更新推上去就看得到
const fresh = path => path + (path.includes('?') ? '&' : '?') + 't=' + Date.now();
const getJSON = path => fetch(fresh(path), { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(path + ' ' + r.status); return r.json(); });
const md = text => DOMPurify.sanitize(marked.parse(text || ''));
// 搜尋索引：各分頁載入時登記 { where, title, text, go }
const SEARCH = {};
const LABEL = t => ({ ...TAB_LABELS, ...(site.tabLabels || {}) })[t] || t;
function focusCard(tab, selector, n) {
  showTab(tab);
  const el = document.querySelectorAll('#' + tab + ' ' + selector)[n];
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600);
}
const privateLink = p => `https://github.com/${site.privateRepo}/blob/main/` + p.split('/').map(encodeURIComponent).join('/');

function showTab(name) {
  if (!site.tabs.includes(name)) name = site.tabs[0];
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  site.tabs.forEach(t => { const s = document.getElementById(t); if (s) s.hidden = t !== name; });
  try { localStorage.setItem(site.storageKey, name); } catch (e) {}
  if (name === 'commits') loadCommits();
}

// ---------- 目前進度 ----------
async function loadStatus() {
  const s = await getJSON('data/status.json');
  const chips = [...(site.chips || []), s.updated ? '最後更新 ' + s.updated : null].filter(Boolean);
  document.getElementById('meta').innerHTML = chips.map(x => `<span class="chip">${esc(x)}</span>`).join('');
  const goals = (s.goals || []).map(g => `
    <div class="card goal">
      <span class="badge ${esc(g.status)}">${esc(GOAL_STATUS[g.status] || g.status)}</span>
      <h3>${esc(g.title)}</h3>
      <p>${esc(g.detail)}</p>
    </div>`).join('');
  const next = (s.next || []).map(n => `<li>${esc(n)}</li>`).join('');
  SEARCH.status = [
    ...(s.goals || []).map((g, n) => ({ where: 'status', title: g.title, text: [GOAL_STATUS[g.status], g.detail].join(' '), go: () => focusCard('status', '.goal', n) })),
    ...(s.next || []).map((x, n) => ({ where: 'status', title: '下一步', text: x, go: () => focusCard('status', '.next li', n) }))];
  document.getElementById('status').innerHTML = goals + (next ? `<h2>下一步</h2><div class="card"><ol class="next">${next}</ol></div>` : '');
}

// ---------- 開發進度（程式專案用） ----------
async function loadModules() {
  const box = document.getElementById('modules');
  try {
    const a = await getJSON('data/modules.json');
    const flow = (a.architecture || []).map(x => `<li>${esc(x)}</li>`).join('');
    const parts = (a.components || []).map(g => `
      <div class="card goal">
        <span class="badge ${esc(g.status)}">${esc(GOAL_STATUS[g.status] || g.status)}</span>
        <h3>${esc(g.title)}</h3>
        <p>${esc(g.detail)}</p>
      </div>`).join('');
    const log = (a.log || []).map(l => `<div class="row-line"><time>${esc(l.date)}</time><span>${esc(l.text)}</span><small class="muted">${esc(l.author)}</small></div>`).join('');
    const next = (a.next || []).map(n => `<li>${esc(n)}</li>`).join('');
    box.innerHTML = `
      <div class="card"><p style="margin:0">${esc(a.summary)}</p>
        ${flow ? `<p class="muted" style="margin:8px 0 0">架構：</p><ol class="next">${flow}</ol>` : ''}
        <p class="muted" style="margin:8px 0 0">最後更新 ${esc(a.updated)}</p></div>
      <h2>模組進度</h2>${parts}
      ${next ? `<h2>下一步</h2><div class="card"><ol class="next">${next}</ol></div>` : ''}
      ${log ? `<h2>開發紀錄</h2><div class="card">${log}</div>` : ''}`;
    SEARCH.modules = [
      ...(a.components || []).map((g, n) => ({ where: 'modules', title: g.title, text: [GOAL_STATUS[g.status], g.detail].join(' '), go: () => focusCard('modules', '.goal', n) })),
      ...(a.next || []).map((x, n) => ({ where: 'modules', title: '下一步', text: x, go: () => focusCard('modules', '.next li', n) })),
      ...(a.log || []).map((l, n) => ({ where: 'modules', title: '開發紀錄 ' + (l.date || ''), text: [l.text, l.author].join(' '), go: () => focusCard('modules', '.row-line', n) }))];
  } catch (e) {
    box.innerHTML = `<div class="card">無法載入開發進度（${esc(e.message)}）。</div>`;
  }
}

// ---------- 項目（活動 / 比賽 / 里程碑…，一個項目一個 items/*.json） ----------
let items = [];
async function loadItems() {
  const box = document.getElementById('item-list');
  try {
    let names;
    try {
      // 用 GitHub API 列資料夾：表單剛新增的項目，在 Pages 重建前就看得到
      const res = await fetch(`https://api.github.com/repos/${site.repo}/contents/items?ref=main&t=${Date.now()}`);
      if (!res.ok) throw new Error('GitHub ' + res.status);
      names = (await res.json()).filter(e => e.type === 'file' && /^[\w.-]+\.json$/.test(e.name)).map(e => e.name);
    } catch (e) {
      names = await getJSON('items/index.json');   // 沒設定 repo 或 API 次數用完時的備援清單
    }
    items = (await Promise.all(names.map(async n => {
      try {
        let c;
        try { c = await getJSON('items/' + n); }
        // Pages 還沒重建時改讀 GitHub 原始檔（約 5 分鐘快取）
        catch (e) { c = await fetch(`https://raw.githubusercontent.com/${site.repo}/main/items/${n}`).then(r => r.json()); }
        c._file = n; return c;
      } catch (e) { return { title: n + '（讀取失敗）', date: '', _file: n }; }
    }))).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  } catch (e) {
    box.innerHTML = `<div class="card">無法載入清單（${esc(e.message)}）。</div>`;
    return;
  }
  const st = site.itemStatus || {};
  SEARCH.items = items.map((c, i) => ({ where: 'items', title: c.title,
    text: [c.date, st[c.status] || c.status, c.result, c.summary, Object.entries(c.facts || {}).flat().join(' '), c.description, (c.links || []).map(l => l.title).join(' ')].join(' '),
    go: () => { openItem(i); history.replaceState(null, '', '#item=' + encodeURIComponent(c._file)); } }));
  box.innerHTML = items.length ? items.map((c, i) => `
    <a class="card item" href="#item=${encodeURIComponent(c._file)}" data-i="${i}">
      <div class="row"><span class="badge ${esc(c.status)}">${esc(st[c.status] || c.status || '未設定')}</span>${esc(c.date)}${c.result ? ' · ' + esc(c.result) : ''}</div>
      <h3>${esc(c.title)}</h3>
      ${c.summary ? `<p>${esc(c.summary)}</p>` : ''}
    </a>`).join('') : `<div class="card muted">還沒有資料，按「＋ 新增」新增第一筆。</div>`;
  box.querySelectorAll('.item').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); openItem(+a.dataset.i); history.replaceState(null, '', a.getAttribute('href'));
  }));
}

let fileGroups = [];
function openItem(i) {
  const c = items[i];
  if (!c) return;
  showTab('items');
  const st = site.itemStatus || {};
  const el = document.getElementById('item-detail');
  const facts = Object.entries(c.facts || {}).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
  const links = (c.links || []).filter(l => /^https?:\/\//.test(l.url));
  const folders = (c.files_folders || []).map(f => fileGroups.find(g => g.folder === f)).filter(Boolean);
  el.innerHTML = `
    <span class="badge ${esc(c.status)}">${esc(st[c.status] || c.status || '未設定')}</span>
    <h2 style="margin-top:8px">${esc(c.title)}</h2>
    <dl class="facts"><dt>日期</dt><dd>${esc(c.date)}</dd>${c.result ? `<dt>結果</dt><dd>${esc(c.result)}</dd>` : ''}${facts}</dl>
    ${md(c.description)}
    ${links.length ? `<h3>相關連結</h3><ul>${links.map(l => `<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title || l.url)}</a></li>`).join('')}</ul>` : ''}
    ${folders.map(g => `<h3>🔒 ${esc(g.title)}</h3>${g.files.map(fileRow).join('')}`).join('')}
    ${site.repo ? `<p class="muted" style="margin-top:16px"><a href="https://github.com/${site.repo}/edit/main/items/${encodeURIComponent(c._file)}" target="_blank" rel="noopener">在 GitHub 編輯這筆資料</a>（需登入專案帳號）</p>` : ''}`;
  el.hidden = false;
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function itemFromForm() {
  const f = new FormData(document.getElementById('item-form'));
  const v = k => String(f.get(k) || '').trim();
  const pairs = k => v(k).split('\n').map(s => s.trim()).filter(Boolean).map(s => s.includes('|') ? s.split('|').map(x => x.trim()) : ['', s]);
  return {
    title: v('title'), date: v('date'), status: v('status'), result: v('result'), summary: v('summary'),
    facts: Object.fromEntries(pairs('facts').filter(p => p[0])),
    description: v('description'),
    files_folders: [],
    links: pairs('links').map(([title, url]) => ({ title, url }))
  };
}

function setupItemForm() {
  const form = document.getElementById('item-form'), msg = document.getElementById('item-form-msg');
  document.getElementById('item-status').innerHTML = Object.entries(site.itemStatus || {}).map(([k, t]) => `<option value="${esc(k)}">${esc(t)}</option>`).join('');
  document.getElementById('add-item-btn').addEventListener('click', () => { form.hidden = false; form.elements.namedItem('title').focus(); });
  document.getElementById('cancel-item-btn').addEventListener('click', () => { form.hidden = true; msg.textContent = ''; });
  document.getElementById('copy-item-btn').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(JSON.stringify(itemFromForm(), null, 2)); msg.textContent = '已複製'; }
    catch (e) { msg.textContent = '無法複製，請改用「送到 GitHub」'; }
  });
  form.addEventListener('submit', e => {
    e.preventDefault();
    const c = itemFromForm();
    // 檔名只用英數字：日期 + 5 碼亂數
    const file = `${c.date}-${Math.random().toString(36).slice(2, 7)}.json`;
    const url = `https://github.com/${site.repo}/new/main?filename=${encodeURIComponent('items/' + file)}&value=${encodeURIComponent(JSON.stringify(c, null, 2) + '\n')}`;
    window.open(url, '_blank', 'noopener');
    msg.textContent = '已開啟 GitHub，按 Commit changes 後約 1 分鐘重新整理這頁就看得到。';
  });
}

// ---------- 版本紀錄 ----------
async function loadVersions() {
  const list = await getJSON('data/versions.json');
  SEARCH.versions = list.map((v, n) => ({ where: 'versions', title: 'v' + v.version + ' ' + (v.title || ''), text: [v.date, v.author, ...(v.changes || [])].join(' '), go: () => focusCard('versions', '.card', n) }));
  document.getElementById('versions').innerHTML = list.map(v => `
    <div class="card">
      <div class="ver"><span class="v">v${esc(v.version)}</span><strong>${esc(v.title)}</strong><small>${esc(v.date)} · ${esc(v.author)}</small></div>
      <ul>${(v.changes || []).map(c => `<li>${esc(c)}</li>`).join('')}</ul>
    </div>`).join('');
}

// ---------- 筆記 ----------
async function loadNotes() {
  const list = await getJSON('notes/index.json');
  document.getElementById('notes-list').innerHTML = list.map(n =>
    `<a href="#note=${encodeURIComponent(n.file)}" data-file="${esc(n.file)}">${esc(n.title)}<small>${esc(n.date)} · ${esc(n.author)}</small></a>`).join('') || '<p class="muted">還沒有筆記。</p>';
  const goNote = file => () => { openNote(file); history.replaceState(null, '', '#note=' + encodeURIComponent(file)); };
  SEARCH.notes = list.map(n => ({ where: 'notes', title: n.title, text: [n.date, n.author].join(' '), go: goNote(n.file) }));
  // 背景讀每篇筆記全文，讓搜尋也找得到內文
  list.forEach((n, k) => fetch(fresh('notes/' + n.file), { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(t => {
    SEARCH.notes[k].text += ' ' + t;
  }).catch(() => {}));
  document.querySelectorAll('#notes-list a').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); openNote(a.dataset.file); history.replaceState(null, '', '#note=' + encodeURIComponent(a.dataset.file));
  }));
}

async function openNote(file) {
  if (!/^[\w.-]+\.md$/.test(file)) return;   // 只接受英數字檔名，避免路徑注入
  showTab('notes');
  const el = document.getElementById('note');
  el.hidden = false;
  el.textContent = '載入中…';
  el.innerHTML = md(await fetch(fresh('notes/' + file), { cache: 'no-store' }).then(r => r.text()));
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ---------- 原始檔（連到私人儲存庫） ----------
const fileRow = f => `<div class="file"><a href="${esc(privateLink(f.path))}" target="_blank" rel="noopener">${esc(f.name)}</a><span class="muted">${esc(f.tool || '')}</span><span class="muted size">${Number(f.kb || 0).toLocaleString()} KB</span></div>`;
async function loadFiles() {
  fileGroups = await getJSON('data/files.json');
  SEARCH.files = fileGroups.flatMap(g => g.files.map(f => ({ where: 'files', title: f.name, text: [g.title, f.path, f.tool].join(' '),
    go: () => { showTab('files'); window.open(privateLink(f.path), '_blank', 'noopener'); } })));
  document.getElementById('file-groups').innerHTML = fileGroups.map(g => `
    <h2>${esc(g.title)} <small class="muted">${g.files.length} 個檔案</small></h2>
    <div class="card">${g.files.map(fileRow).join('')}</div>`).join('');
}

// ---------- 更新紀錄（GitHub commits） ----------
let commitsLoaded = false;
async function loadCommits() {
  if (commitsLoaded) return;
  commitsLoaded = true;
  const box = document.getElementById('commit-list');
  try {
    const res = await fetch(`https://api.github.com/repos/${site.repo}/commits?per_page=30`);
    if (!res.ok) throw new Error(res.status);
    box.innerHTML = (await res.json()).map(c => `<div class="row-line">
        <a href="${esc(c.html_url)}"><code>${esc(c.sha.slice(0, 7))}</code></a>
        <span>${esc(c.commit.message.split('\n')[0])}</span>
        <time datetime="${esc(c.commit.author.date)}">${new Date(c.commit.author.date).toLocaleString('zh-TW', { dateStyle: 'short', timeStyle: 'short' })}</time>
      </div>`).join('');
  } catch (e) {
    commitsLoaded = false;
    box.innerHTML = `無法載入 GitHub 紀錄（${esc(e.message)}）。可直接到 <a href="https://github.com/${esc(site.repo)}/commits/main">GitHub</a> 查看。`;
  }
}

// ---------- 全站搜尋 ----------
function snippet(text, words) {
  const t = String(text || '').replace(/[#*_`>|]+/g, ' ').replace(/\s+/g, ' ').trim(), low = t.toLowerCase();
  const found = words.map(w => low.indexOf(w)).filter(i => i >= 0);
  const at = Math.max(0, (found.length ? Math.min(...found) : 0) - 30);
  return (at > 0 ? '…' : '') + t.slice(at, at + 110) + (t.length > at + 110 ? '…' : '');
}
function highlight(text, words) {
  let h = esc(text);
  words.forEach(w => { h = h.replace(new RegExp(esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => '<mark>' + m + '</mark>'); });
  return h;
}
function runSearch(q) {
  const box = document.getElementById('search-results');
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) { box.hidden = true; box.innerHTML = ''; return; }
  // 空白分開的每個詞都要出現；標題命中的排前面
  const hits = site.tabs.flatMap(t => SEARCH[t] || []).map(e => {
    const title = String(e.title || '').toLowerCase(), all = title + ' ' + String(e.text || '').toLowerCase();
    return words.every(w => all.includes(w)) ? { e, score: words.filter(w => title.includes(w)).length } : null;
  }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 30);
  box.hidden = false;
  box.innerHTML = hits.length
    ? `<p class="muted" style="margin:0 0 4px">找到 ${hits.length}${hits.length === 30 ? '+' : ''} 筆（Enter 開第一筆，Esc 關閉）</p>` +
      hits.map((h, n) => `<a class="hit" href="#" data-n="${n}"><span class="where">${esc(LABEL(h.e.where))}</span><strong>${highlight(h.e.title, words)}</strong><p>${highlight(snippet(h.e.text, words), words)}</p></a>`).join('')
    : `<p class="muted" style="margin:0">找不到「${esc(q)}」。換個關鍵字，或用空白分開多個詞試試。</p>`;
  box.querySelectorAll('.hit').forEach(a => a.addEventListener('click', ev => { ev.preventDefault(); box.hidden = true; hits[+a.dataset.n].e.go(); }));
}
function setupSearch() {
  const input = document.getElementById('search-box');
  let timer;
  input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => runSearch(input.value), 150); });
  input.addEventListener('focus', () => { if (input.value) runSearch(input.value); });
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') { input.value = ''; runSearch(''); input.blur(); }
    if (e.key === 'Enter') { const first = document.querySelector('#search-results .hit'); if (first) first.click(); }
  });
  // 按「/」跳到搜尋框（正在輸入時不搶）
  document.addEventListener('keydown', e => {
    if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { e.preventDefault(); input.focus(); }
  });
}

// ---------- 啟動 ----------
const LOADERS = { status: loadStatus, modules: loadModules, items: loadItems, versions: loadVersions, notes: loadNotes, files: loadFiles };
(async () => {
  try { site = await getJSON('data/site.json'); }
  catch (e) { document.getElementById('site-title').textContent = '找不到 data/site.json'; return; }
  site.tabs = (site.tabs || ['status', 'versions', 'notes', 'commits']).filter(t => TAB_LABELS[t]);
  site.storageKey = (site.repo || site.title || 'site') + ':tab';
  document.title = site.title || '專案網站';
  document.getElementById('site-title').textContent = site.title || '';
  document.getElementById('site-subtitle').textContent = site.subtitle || '';
  if (site.description) document.querySelector('meta[name=viewport]').insertAdjacentHTML('afterend', `<meta name="description" content="${esc(site.description)}">`);
  const labels = { ...TAB_LABELS, ...(site.tabLabels || {}) };
  document.getElementById('tabs').innerHTML = site.tabs.map(t => `<button role="tab" data-tab="${t}" aria-selected="false">${esc(labels[t])}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => { showTab(b.dataset.tab); history.replaceState(null, '', '#' + b.dataset.tab); }));
  document.getElementById('items-hint').textContent = site.itemsHint || '每一筆一張卡片，點開看詳細內容。';
  document.getElementById('item-form-title').textContent = '新增' + (labels.items || '');
  document.getElementById('add-item-btn').textContent = '＋ 新增' + (labels.items || '');
  document.getElementById('footer').innerHTML = md(site.footer || (site.repo ? `更新方式見 [AGENTS.md](https://github.com/${site.repo}/blob/main/AGENTS.md)。` : ''));
  if (site.tabs.includes('items')) setupItemForm();
  setupSearch();

  // files 先載入，項目詳細頁才能列出相關原始檔
  if (site.tabs.includes('files')) { try { await loadFiles(); } catch (e) { document.getElementById('file-groups').innerHTML = `<div class="card">無法載入原始檔清單（${esc(e.message)}）。</div>`; } }
  await Promise.all(site.tabs.filter(t => LOADERS[t] && t !== 'files').map(t => LOADERS[t]().catch(e => {
    document.getElementById(t).innerHTML = `<div class="card">資料載入失敗：${esc(e.message)}</div>`;
  })));

  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('note=')) openNote(h.slice(5));
  else if (h.startsWith('item=')) openItem(items.findIndex(c => c._file === h.slice(5)));
  else if (site.tabs.includes(h)) showTab(h);
  else { let t = null; try { t = localStorage.getItem(site.storageKey); } catch (e) {} showTab(t || site.tabs[0]); }
})();
</script>
